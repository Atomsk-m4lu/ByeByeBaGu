  <ellipse cx="64" cy="80" rx="35" ry="29" fill="#3A414D"/>
  <!-- 眼 -->
  <circle cx="50" cy="78" r="9.5" fill="#F5F0E1"/>
  <circle cx="78" cy="78" r="9.5" fill="#F5F0E1"/>
  <circle cx="52" cy="80" r="4.5" fill="#12161F"/>
  <circle cx="80" cy="80" r="4.5" fill="#12161F"/>
