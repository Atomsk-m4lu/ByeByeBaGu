  <rect x="24" y="54" width="17" height="26" rx="8.5" fill="#10151c"/>
  <rect x="24" y="54" width="17" height="26" rx="8.5" fill="none" stroke="#00E676" stroke-width="2.5"/>
  <rect x="87" y="54" width="17" height="26" rx="8.5" fill="#10151c"/>
  <rect x="87" y="54" width="17" height="26" rx="8.5" fill="none" stroke="#00E676" stroke-width="2.5"/>
